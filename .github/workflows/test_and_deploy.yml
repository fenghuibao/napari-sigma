name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      QT_API: pyqt6
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libopengl0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xinput0 libxcb-xfixes0 libxkbcommon-x11-0
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
      - name: Check Linux Qt plugin dependencies
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import PyQt6
          root = Path(PyQt6.__file__).parent / "Qt6" / "plugins"
          for plugin in [root / "platforms" / "libqxcb.so", *sorted((root / "xcbglintegrations").glob("*.so"))]:
              dependencies = subprocess.check_output(["ldd", str(plugin)], text=True)
              print(plugin, dependencies, sep="\n")
              if "not found" in dependencies:
                  raise SystemExit("Missing Qt system libraries")
          PY
      - name: Test on Linux virtual display
        if: runner.os == 'Linux'
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/sigma-numba
          MPLCONFIGDIR: ${{ runner.temp }}/sigma-matplotlib
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Test on macOS
        if: runner.os == 'macOS'
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/sigma-numba
          MPLCONFIGDIR: ${{ runner.temp }}/sigma-matplotlib
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and validate distribution
        run: |
          python -m pip install --upgrade pip build twine
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=$(PYTHONPATH=src python -c 'from napari_sigma import __version__; print(__version__)')
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
          python -m build .
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/napari-sigma
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
