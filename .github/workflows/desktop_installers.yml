name: Desktop installers (unsigned)

# One platform can be verified before the others are produced. This workflow
# file does not exist on the default branch, so GitHub does not offer its
# "Run workflow" button; pushing is the trigger that actually works here, and
# a [build: ...] tag in the commit message chooses the platforms.
on:
  push:
    branches: [build/desktop-installers]
    paths: ["installer/**", ".github/workflows/desktop_installers.yml", "tests/**"]
  workflow_dispatch:
    inputs:
      targets:
        description: Platforms to build
        type: choice
        default: osx-arm64
        options: [osx-arm64, osx-64, win-64, macos, all]

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-${{ github.ref }}-${{ github.sha }}-${{ inputs.targets }}
  cancel-in-progress: false

jobs:
  select-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      windows-run: ${{ steps.select.outputs.windows-run }}
    steps:
      - id: select
        shell: python
        run: |
          import json, os, re
          platforms = {
              "osx-arm64": {"os": "macos-15", "target": "osx-arm64"},
              "osx-64": {"os": "macos-15-intel", "target": "osx-64"},
              "win-64": {"os": "windows-2022", "target": "win-64"},
          }
          groups = {"all": list(platforms), "macos": ["osx-arm64", "osx-64"]}
          # A dispatch states its targets outright. A push carries them in a
          # "[build: osx-arm64]" tag, and builds every platform without one.
          requested = ${{ toJSON(inputs.targets || '') }}
          message = ${{ toJSON(github.event.head_commit.message || '') }}
          if not requested:
              tag = re.search(r"\[build:([^\]]+)\]", message)
              requested = tag.group(1) if tag else "all"
          names = []
          for name in requested.replace(",", " ").split():
              names.extend(groups.get(name, [name]))
          unknown = [name for name in names if name not in platforms]
          if unknown:
              raise SystemExit(f"Unknown build target(s) {unknown}; choose from {list(platforms)} or {list(groups)}")
          chosen = [platforms[name] for name in dict.fromkeys(names)]
          reuse = re.search(r"\[verify-windows:(\d+)\]", message)
          if reuse and names != ["win-64"]:
              raise SystemExit("An existing Windows artifact can only be tested with win-64")
          print(f"Building: {[entry['target'] for entry in chosen]}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matrix={json.dumps(chosen)}\n")
              output.write(f"windows-run={reuse.group(1) if reuse else ''}\n")

  build-and-install:
    needs: select-targets
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: sigma-builder
          python-version: "3.13"
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install isolated build tools
        run: conda install --override-channels -c conda-forge constructor=3.16.1 conda-standalone menuinst=2.5.2 pillow pyyaml pip setuptools --yes --quiet
      - name: Packaging unit tests
        run: python -m unittest discover -s installer/tests -v
      - name: Build offline installer
        if: needs.select-targets.outputs.windows-run == ''
        run: python installer/build.py --source-dir "$GITHUB_WORKSPACE" --work-dir "$RUNNER_TEMP/sigma-build" --output-dir dist-desktop
      - name: Retrieve existing Windows package for test-only changes
        if: needs.select-targets.outputs.windows-run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SIGMA_ARTIFACT_RUN: ${{ needs.select-targets.outputs.windows-run }}
        run: gh run download "$SIGMA_ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" --name SIGMA-0.0.6-win-64-unsigned --dir dist-desktop
      - name: Verify reused package integrity and current source
        if: needs.select-targets.outputs.windows-run != ''
        shell: python
        run: |
          import hashlib, json, pathlib, shutil
          root = pathlib.Path('dist-desktop')
          source = json.loads((root / 'source-provenance.json').read_text())
          for relative, expected in source['core_files'].items():
              assert hashlib.sha256((pathlib.Path('src') / relative).read_bytes()).hexdigest() == expected, relative
          for relative, expected in source['desktop_files'].items():
              assert hashlib.sha256((pathlib.Path('installer') / relative).read_bytes()).hexdigest() == expected, relative
          package, = root.glob('*Windows*.zip')
          with package.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == package.with_suffix('.zip.sha256').read_text().split()[0]
          # Previous test outputs must never be mistaken for this run's results.
          for name in ('verification', 'diagnostics'):
              if (root / name).exists():
                  shutil.rmtree(root / name)
      - name: Collect failed macOS disk-image diagnostics
        if: failure() && runner.os == 'macOS'
        run: |
          mkdir -p dist-desktop/diagnostics
          hdiutil info > dist-desktop/diagnostics/disk-images.txt
          df -h > dist-desktop/diagnostics/disk-space.txt
          ps -axo pid,ppid,etime,%cpu,comm > dist-desktop/diagnostics/processes.txt
      - name: Verify read-only DMG, relocated macOS app and deletion uninstall
        if: runner.os == 'macOS'
        run: python installer/ci_macos_app.py --dmg dist-desktop/*.dmg --build-dir "$RUNNER_TEMP/sigma-build" --output-dir dist-desktop/verification --source-dir "$GITHUB_WORKSPACE"
      - name: Install Windows package (path with spaces)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $download = (Get-ChildItem dist-desktop/*Windows*.zip).FullName
          $extracted = "$env:RUNNER_TEMP\SIGMA Offline Installer"
          Expand-Archive -LiteralPath $download -DestinationPath $extracted
          $package = Join-Path $extracted 'SIGMA-Setup.exe'
          $prefix = "$env:LOCALAPPDATA\SIGMA Desktop Test\0.0.6"
          $proc = Start-Process -FilePath $package -ArgumentList "/S /InstallationType=JustMe /AddToPath=0 /RegisterPython=0 /D=$prefix" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed with exit code $($proc.ExitCode)" }
          "SIGMA_TEST_PREFIX=$prefix" >> $env:GITHUB_ENV
          # The installed app must work after the download/payload is removed.
          Remove-Item -LiteralPath $extracted -Recurse -Force
      - name: Prepare Windows runner OpenGL display
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installer/ci_windows_graphics.ps1
      - name: Verify installed Windows application and core regressions
        if: runner.os == 'Windows'
        # No driver or rendering shim is added to the distributable application.
        # The preceding step prepares only the disposable runner's display.
        run: python installer/verify.py --prefix "$SIGMA_TEST_PREFIX" --output-dir dist-desktop/verification --source-dir "$GITHUB_WORKSPACE"
      - name: Test Windows uninstaller
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $uninstaller = (Get-ChildItem "$env:SIGMA_TEST_PREFIX\Uninstall*.exe").FullName
          if (!$uninstaller) { throw "Uninstaller was not created" }
          $proc = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Uninstaller failed" }
          $record = Get-Content dist-desktop/verification/verification.json | ConvertFrom-Json
          foreach ($shortcut in $record.shortcuts.paths) {
            if (Test-Path $shortcut) { throw "Shortcut remains after uninstall: $shortcut" }
          }
      - name: Collect Windows installation diagnostics
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-desktop/diagnostics | Out-Null
          $log = "$env:SIGMA_TEST_PREFIX\sigma-desktop\installation.log"
          if ($env:SIGMA_TEST_PREFIX -and (Test-Path $log)) {
            Copy-Item $log dist-desktop/diagnostics/pip-installation.log
          }
      - name: Upload lightweight Windows verification records
        uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: SIGMA-0.0.6-win-64-checks
          path: |
            dist-desktop/verification/
            dist-desktop/source-provenance.json
            dist-desktop/bundle-win-64.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SIGMA-0.0.6-${{ matrix.target }}-unsigned
          path: dist-desktop/
          compression-level: 0
          retention-days: 30
