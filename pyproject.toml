[project]
name = "napari-sigma"
dynamic = ["version"]
description = "SIGMA (Structurally-aware Intensity-ordered GMM-MRF Algorithm) is a microscopy toolkit for structural and dynamic analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Huibao Feng", email = "fenghuibao@gmail.com"},
]
keywords = [
    "napari",
    "microscopy",
    "segmentation",
    "morphology",
    "tracking",
    "proximity-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.11"
dependencies = [
    "dask[array]>=2024.1.0",
    "matplotlib>=3.7.0",
    "napari>=0.9.0,<0.10",
    "numpy>=1.24.0",
    "opencv-python>=4.7.0",
    "openpyxl>=3.1.0",
    "pillow>=9.0.0",
    "qtpy>=2.4.0",
    "scikit-image>=0.20.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "tifffile>=2023.1.1",
    "torch>=2.0.0",
]

[project.optional-dependencies]
# Provide a reproducible end-user installation with napari's Qt6 backend.
all = ["napari[pyqt6,optional]>=0.9.0,<0.10"]

[project.urls]
Homepage = "https://github.com/fenghuibao/napari-sigma"
Repository = "https://github.com/fenghuibao/napari-sigma"
Issues = "https://github.com/fenghuibao/napari-sigma/issues"

[project.entry-points."napari.manifest"]
napari-sigma = "napari_sigma:napari.yaml"



[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "napari_sigma._version.__version__"}

[tool.setuptools.package-data]
napari_sigma = ["napari.yaml"]
